name: keep warm

# Render's free tier spins the service down after ~15 idle minutes and a
# cold start costs ~1 min plus a few minutes of Storm Watch re-coverage.
# A ten-minute heartbeat keeps floodlight.onrender.com hot for demo day;
# the ping also touches the storm-watch endpoint so the 32-city table is
# fresh the moment anyone opens the war room.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping /healthz
        run: |
          curl -sS --max-time 45 https://floodlight.onrender.com/healthz || true
          echo
      - name: warm storm watch
        run: |
          curl -sS --max-time 60 -o /dev/null -w "stormwatch %{http_code} in %{time_total}s\n" \
            https://floodlight.onrender.com/api/stormwatch || true
