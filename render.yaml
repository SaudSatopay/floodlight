# One-click Render deploy — https://render.com/deploy
# (Free tier is fine: single uvicorn process, no database.)
services:
  - type: web
    name: floodlight
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn floodlight.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
